<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div>
        <h2> CV Database List</h2>
    </div>
    {% for profile in profiles %}
    <div class="container">
    <div class="row">
        <div class="col-md-6">
            <strong>{{profile.name}}</strong>
        </div>
        <div class="col-md-6">
            <a href="{% url 'resume' profile.id %}" class="btn btn-primary">Download CV</a>
        </div>
    </div>
    </div>
    {% endfor %}
</body>
</html>
